<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>刷卡 / VIN 卡号查询 · 充电桩报文分析</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=20260806-order" />
</head>
<body class="page-cards">
  <div class="bg" aria-hidden="true"></div>

  <div id="loginGate" class="login-gate" hidden>
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="login-brand">
        <div class="mark login-mark" aria-hidden="true"></div>
        <div>
          <p class="login-kicker">EV Protocol Agent</p>
          <h1 class="login-product">充电桩报文分析</h1>
        </div>
      </div>
      <label class="field">
        <span>用户名</span>
        <input type="text" id="loginUser" name="username" autocomplete="username" required placeholder="输入用户名" />
      </label>
      <label class="field">
        <span>密码</span>
        <input type="password" id="loginPass" name="password" autocomplete="current-password" required placeholder="输入密码" />
      </label>
      <label class="login-remember">
        <input type="checkbox" id="loginRemember" />
        <span>记住账号</span>
      </label>
      <p class="login-error" id="loginError" hidden></p>
      <button type="submit" class="btn primary login-submit" id="loginBtn">登录</button>
    </form>
  </div>

  <div class="app" id="mainApp" hidden>
    <header class="top">
      <div class="top-bar">
        <div class="brand">
          <div class="mark" aria-hidden="true"></div>
          <div class="brand-text">
            <p class="brand-kicker">EV Protocol Agent</p>
            <h1>充电桩报文分析</h1>
            <p class="tagline">查询刷卡与 VIN 启动卡号，失败时显示原因</p>
          </div>
        </div>
        <div class="top-aside">
          <div class="user-bar" id="userBar" hidden>
            <span class="user-name" id="userName"></span>
            <button type="button" class="btn ghost small" id="logoutBtn">退出</button>
          </div>
          <div class="meta" id="protocolCount">协议加载中…</div>
        </div>
      </div>
      <nav class="page-nav" aria-label="页面切换">
        <a class="page-nav-link" href="/">订单查询</a>
        <a class="page-nav-link" href="/device">设备报文</a>
        <a class="page-nav-link active" href="/cards" aria-current="page">卡号查询</a>
      </nav>
    </header>

    <main class="layout">
      <section class="panel input-panel">
        <div class="panel-head">
          <div>
            <p class="step-label">查询条件</p>
            <h2>拉取设备报文</h2>
          </div>
        </div>

        <div class="fetch-box fetch-box-plain">
          <div class="fetch-grid">
            <label class="field">
              <span>设备编号 deviceNo *</span>
              <input type="text" id="fetchDeviceNo" placeholder="例如 88668820241220125801" autocomplete="off" />
            </label>
            <label class="field">
              <span>开始日期 *</span>
              <input type="date" id="fetchStartDate" />
            </label>
            <label class="field">
              <span>开始时刻 *</span>
              <div class="time-row">
                <select id="fetchStartHour" aria-label="开始小时"></select>
                <span class="time-sep">时</span>
                <select id="fetchStartMinute" aria-label="开始分钟"></select>
                <span class="time-sep">分</span>
              </div>
            </label>
            <label class="field">
              <span>结束日期 *</span>
              <input type="date" id="fetchEndDate" />
            </label>
            <label class="field">
              <span>结束时刻 *</span>
              <div class="time-row">
                <select id="fetchEndHour" aria-label="结束小时"></select>
                <span class="time-sep">时</span>
                <select id="fetchEndMinute" aria-label="结束分钟"></select>
                <span class="time-sep">分</span>
              </div>
            </label>
          </div>
          <div class="actions fetch-actions">
            <button type="button" class="btn accent" id="queryBtn">查询卡号</button>
            <p class="hint inline" id="fetchHint">将解析刷卡启动与 VIN 启动的卡号；失败会附带原因。</p>
          </div>
        </div>

        <details class="payload-details">
          <summary>高级：粘贴报文文本查询</summary>
          <label class="field grow">
            <span>报文内容</span>
            <textarea id="payload" spellcheck="false" placeholder="也可粘贴平台日志，不填设备编号时直接从此文本解析"></textarea>
          </label>
          <div class="actions">
            <button type="button" class="btn ghost" id="parseTextBtn">从文本解析</button>
            <button type="button" class="btn ghost" id="clearBtn">清空</button>
          </div>
        </details>
      </section>

      <section class="panel result-panel">
        <div class="panel-head">
          <div>
            <p class="step-label">查询结果</p>
            <h2>卡号列表</h2>
          </div>
        </div>

        <div id="emptyState" class="empty">
          <div class="empty-illus" aria-hidden="true"></div>
          <p class="empty-title">等待查询</p>
          <ol class="empty-steps">
            <li>填写设备编号与起止时间</li>
            <li>点击「查询卡号」拉取并解析</li>
            <li>失败项会显示原因与卡号</li>
          </ol>
        </div>

        <div id="errorState" class="error" hidden></div>

        <div id="resultView" hidden>
          <div class="summary-grid" id="summaryGrid"></div>
          <div class="card-event-list" id="eventBody"></div>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span>本地分析服务 · 数据不上传第三方</span>
    </footer>
  </div>
  <script src="/static/cards.js?v=20260805-nocopy"></script>
</body>
</html>
