[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-charger-protocol-agent"
version = "0.1.0"
description = "新能源/单车充电桩报文分析智能体，兼容云快充、星星、盛宏、华为、英飞源等协议"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "rich>=13.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
evcpa = "evcpa.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["evcpa*"]

[tool.setuptools.package-data]
evcpa = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
